# Yangi versiya: GitHub → Actions → release → Run workflow → versiya (2.0.1)
#   yoki: git tag v2.0.1 && git push origin v2.0.1
# Test → agent → o'rnatuvchi → reliz. Do'konlardagi agentlar 6 soat ichida o'zi yangilanadi.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versiya (masalan 2.0.1)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq 'workflow_dispatch') { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versiya noto'g'ri: $v" }
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { throw "v$v allaqachon chiqarilgan" }
          "VER=$v" >> $env:GITHUB_ENV
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      # Chek va yorliq namunalar bilan bir xilmi — buzilgan Receipt.cs do'konlarga ketmasin
      - name: Test
        run: dotnet run --project tests/ReceiptTests

      - name: Agent
        run: dotnet publish MebelimPrinterAgent.csproj -c Release -p:Version=${{ env.VER }}

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DAppVer=$env:VER" installer\MebelimPrinterAgent.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup yiqildi' }

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'bin\Release\net8.0-windows\win-x64\publish\MebelimPrinterAgent.exe'
          [ordered]@{
            version = $env:VER
            url     = "https://github.com/${{ github.repository }}/releases/download/v$env:VER/MebelimPrinterAgent.exe"
            sha256  = (Get-FileHash $exe -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content latest.json -Encoding ascii
          gh release create "v$env:VER" $exe installer\Output\MebelimPrinterAgent-Setup.exe latest.json `
            --target "${{ github.sha }}" --title "v$env:VER" --notes "Mebelim Printer Agent $env:VER"
          if ($LASTEXITCODE -ne 0) { throw 'gh release create yiqildi' }
